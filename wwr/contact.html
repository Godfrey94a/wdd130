<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dry Oar Rafting | Contact Us</title>
  <meta name="description" content="Contact Dry Oar Rafting for reservations, questions, or feedback. Find our address, phone, email, and send us a message directly.">
  <meta name="author" content="Godfrey">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
    <!-- Keep your same header from about.html -->
    <img src="images/logo.png" alt="Dry Oar Rafting Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <!-- 1. Company Information -->
    <section class="company-info">
      <h1>Contact Us</h1>
      <div class="info-grid">
        <div class="details">
          <h2>Dry Oar Rafting Company</h2>
          <p>123 Main River Street<br>
          Kolob, California</p>
          <p>+1 999 999 9999</p>
          <p>info@dryoar.com</p>
        </div>
        <div class="map">
          <iframe 
            src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d12345.6789!2d-111.123!3d40.123!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1234567890" 
            width="400" 
            height="300" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
      </div>
    </section>

    <!-- 2. Employee Profiles -->
    <section class="employees">
      <h2>We Are Here to Serve You</h2>
      <div class="employee-grid">
        <figure>
          <img src="images/sarah.jpg" alt="Sarah - Lead River Guide">
          <figcaption>Sarah Johnson<br>Lead River Guide</figcaption>
        </figure>
        <figure>
          <img src="images/mike.jpg" alt="Mike - Safety Coordinator">
          <figcaption>Mike Chen<br>Safety Coordinator</figcaption>
        </figure>
        <figure>
          <img src="images/lisa.jpg" alt="Lisa - Reservations Manager">
          <figcaption>Lisa Martinez<br>Reservations Manager</figcaption>
        </figure>
      </div>
    </section>

    <!-- 3. Contact Form -->
    <section class="contact-form">
      <h2>Send Us a Message</h2>
      <form>
        <div class="form-item">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-item">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <fieldset class="form-item">
          <legend>Message Purpose</legend>
          <div class="radio-item">
            <input type="radio" id="general" name="purpose" value="general" checked>
            <label for="general">General Inquiry</label>
          </div>
          <div class="radio-item">
            <input type="radio" id="reservation" name="purpose" value="reservation">
            <label for="reservation">Reservation Question</label>
          </div>
          <div class="radio-item">
            <input type="radio" id="suggestion" name="purpose" value="suggestion">
            <label for="suggestion">Website Suggestion</label>
          </div>
        </fieldset>

        <div class="form-item">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <div class="form-item checkbox">
          <input type="checkbox" id="subscribe" name="subscribe">
          <label for="subscribe">Please subscribe me to the monthly newsletter</label>
        </div>

        <button type="submit">Get in Touch!</button>
      </form>
    </section>
  </main>

  <footer>
    <!-- Keep your same footer from about.html -->
    <p>&copy; 2026 Dry Oar Rafting | Godfrey</p>
    <nav class="socialmedia">
      <a href="https://facebook.com">
        <img src="images/facebook.svg" alt="Facebook Icon">
      </a>
      <a href="https://linkedin.com">
        <img src="images/linkedin.svg" alt="Linkedin Icon">
      </a>
      <a href="https://instagram.com">
        <img src="images/instagram.svg" alt="Instagram Icon">
      </a>
    </nav>
  </footer>
</body>
</html>
